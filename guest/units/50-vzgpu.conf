# environment.d: every user service and login session talks Wayland to sommelier.
WAYLAND_DISPLAY=wayland-0
# X11-only apps: the shared Xwayland (sommelier-x.service); x11-run starts a private one.
DISPLAY=:0
GDK_BACKEND=wayland
QT_QPA_PLATFORM=wayland
SDL_VIDEODRIVER=wayland
MOZ_ENABLE_WAYLAND=1
ELECTRON_OZONE_PLATFORM_HINT=wayland
# No desktop portal outside a GNOME session: GTK would wait seconds for its activation to fail
# at every start. Without portals GTK uses its own file chooser etc.
GDK_DEBUG=no-portals
